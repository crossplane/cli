# A v1 XRD that offers a claim.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpostgres.example.org
spec:
  group: example.org
  names:
    kind: XPostgres
    plural: xpostgres
  claimNames:
    kind: Postgres
    plural: postgres
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              highAvailability:
                type: boolean
