name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.18.0)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
      pre-release:
        type: boolean
        description: 'This is a pre-release (will not update current pointer)'
        required: true
        default: false

permissions:
  contents: read

env:
  AWS_USR: ${{ secrets.AWS_USR }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  CLOUDFRONT_DISTRIBUTION_IDS: ${{ secrets.CLOUDFRONT_DISTRIBUTION_IDS }}

jobs:
  promote:
    permissions:
      contents: read
      packages: write  # for pushing to ghcr.io
      id-token: write  # for assuming the CloudFront invalidation role via OIDC
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Promote Artifacts to S3
        if: env.AWS_USR != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_USR }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PSW }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PRE_RELEASE: ${{ inputs.pre-release }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$PRE_RELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          nix run .#promote-artifacts -- "${GITHUB_REF##*/}" "$VERSION" "$CHANNEL" $PRERELEASE_FLAG

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != '' && env.CLOUDFRONT_DISTRIBUTION_IDS != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1

      - name: Invalidate CloudFront cache
        if: env.AWS_ROLE_ARN != '' && env.CLOUDFRONT_DISTRIBUTION_IDS != ''
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          echo "$CHANNEL" | grep -Eq '^[A-Za-z0-9._-]+$' || {
            echo "::error::channel contains unexpected characters"
            exit 1
          }
          echo "### CloudFront invalidations (/$CHANNEL/*)" >> "$GITHUB_STEP_SUMMARY"
          : > invalidations.txt
          for DIST in $CLOUDFRONT_DISTRIBUTION_IDS; do
            echo "$DIST" | grep -Eq '^E[A-Z0-9]{8,20}$' || {
              echo "::error::CLOUDFRONT_DISTRIBUTION_IDS must be a whitespace-separated list of distribution IDs"
              exit 1
            }
            echo "::add-mask::$DIST"
            ID=$(aws cloudfront create-invalidation \
              --distribution-id "$DIST" \
              --paths "/$CHANNEL/*" \
              --query 'Invalidation.Id' \
              --output text)
            echo "$DIST $ID" >> invalidations.txt
            echo "Created $ID"
          done
          while read -r DIST ID; do
            aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$ID"
            echo "- \`$ID\` OK" >> "$GITHUB_STEP_SUMMARY"
          done < invalidations.txt
