# existing-claim.yaml as a non-Crossplane manager (e.g. Argo CD) last applied it: with
# spec.writeConnectionSecretsToNamespace, which modified-claim.yaml drops.
apiVersion: diff.example.org/v1alpha1
kind: NopClaim
metadata:
  name: test-claim
  namespace: existing-namespace
spec:
  coolField: existing-value
  compositeDeletePolicy: Background
  compositionRef:
    name: claim-composition
  writeConnectionSecretsToNamespace: argocd-secrets
