# Passes every built-in rule.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xnetworks.example.org
spec:
  group: example.org
  names:
    kind: XNetwork
    plural: xnetworks
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [region]
            properties:
              region:
                type: string
                pattern: '^[a-z]+-[a-z]+-[0-9]$'
              visibility:
                type: string
                enum: [Public, Private]
              zones:
                type: array
                x-kubernetes-list-type: set
                items:
                  type: string
              subnets:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    cidr:
                      type: string
              tags:
                type: object
                additionalProperties:
                  type: string
          status:
            type: object
            properties:
              cidr:
                type: string
              endpoints:
                type: array
                x-kubernetes-list-type: atomic
                items:
                  type: object
                  properties:
                    host:
                      type: string
                    port:
                      type: integer
