name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.18.0)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
      pre-release:
        type: boolean
        description: 'This is a pre-release (will not update current pointer)'
        required: true
        default: false

permissions:
  contents: read

env:
  AWS_USR: ${{ secrets.AWS_USR }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  CLOUDFRONT_DISTRIBUTION_IDS: ${{ secrets.CLOUDFRONT_DISTRIBUTION_IDS }}

jobs:
  promote:
    permissions:
      contents: read
      packages: write  # for pushing to ghcr.io
      id-token: write  # for assuming the CloudFront invalidation role via OIDC
    runs-on: ubuntu-26.04

    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: crossplane
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The promoted version is an input, not a tag, so we can't derive it
      # from the ref here. The docs update job needs it for the target path.
      - name: Set Version
        id: set-version
        run: |
          VERSION="${{ inputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Promote Artifacts to S3
        if: env.AWS_USR != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_USR }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PSW }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          PRE_RELEASE: ${{ inputs.pre-release }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$PRE_RELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          nix run .#promote-artifacts -- "${GITHUB_REF##*/}" "$VERSION" "$CHANNEL" $PRERELEASE_FLAG

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != '' && env.CLOUDFRONT_DISTRIBUTION_IDS != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-1

      - name: Invalidate CloudFront cache
        if: env.AWS_ROLE_ARN != '' && env.CLOUDFRONT_DISTRIBUTION_IDS != ''
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          echo "$CHANNEL" | grep -Eq '^[A-Za-z0-9._-]+$' || {
            echo "::error::channel contains unexpected characters"
            exit 1
          }
          echo "### CloudFront invalidations (/$CHANNEL/*)" >> "$GITHUB_STEP_SUMMARY"
          : > invalidations.txt
          for DIST in $CLOUDFRONT_DISTRIBUTION_IDS; do
            echo "$DIST" | grep -Eq '^E[A-Z0-9]{8,20}$' || {
              echo "::error::CLOUDFRONT_DISTRIBUTION_IDS must be a whitespace-separated list of distribution IDs"
              exit 1
            }
            echo "::add-mask::$DIST"
            ID=$(aws cloudfront create-invalidation \
              --distribution-id "$DIST" \
              --paths "/$CHANNEL/*" \
              --query 'Invalidation.Id' \
              --output text)
            echo "$DIST $ID" >> invalidations.txt
            echo "Created $ID"
          done
          while read -r DIST ID; do
            aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$ID"
            echo "- \`$ID\` OK" >> "$GITHUB_STEP_SUMMARY"
          done < invalidations.txt

  update-docs:
    # Docs update once a release is promoted to the stable channel:
    # other-channel promotions must not publish reference docs. Patch releases
    # on supported versions can use pre-release to avoid updating
    # stable/current while still getting versioned docs.
    if: inputs.channel == 'stable'
    needs: promote
    concurrency:
      group: update-cli-docs
      cancel-in-progress: false
    permissions:
      contents: read
    runs-on: ubuntu-26.04

    steps:
      - name: Download Artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_USR }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PSW }}
          AWS_DEFAULT_REGION: us-east-1
          VERSION: ${{ needs.promote.outputs.version }}
        run: |
          mkdir -p bin
          aws s3 cp "s3://crossplane-cli-releases/stable/${VERSION}/linux_amd64/crossplane" bin/crossplane
          chmod +x bin/crossplane

      - name: Checkout Docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: crossplane/docs
          persist-credentials: false
          path: docs

      - name: Determine Target Directory
        id: target
        run: |
          VERSION="${{ needs.promote.outputs.version }}"
          MINOR_VERSION="${VERSION%.*}"
          echo "dir=content/cli/${MINOR_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Generate and check docs
        env:
          TARGET_DIR: ${{ steps.target.outputs.dir }}
        run: |
          mkdir -p "docs/${TARGET_DIR}"
          bin/crossplane generate-docs -o "docs/${TARGET_DIR}/command-reference.md"
          cd docs
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "docs-changed=true" >> "$GITHUB_ENV"
          fi

      - name: Create Pull Request
        if: env.docs-changed == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: generate-token
        with:
          app-id: ${{ secrets.CLI_DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.CLI_DOCS_BOT_APP_PRIVATE_KEY }}
          owner: crossplane
          repositories: docs

      - name: Create docs PR
        if: env.docs-changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          path: docs
          commit-message: "docs(cli): auto-update command reference for ${{ steps.target.outputs.dir }} (${{ inputs.version }})"
          author: cli-docs-bot <info@crossplane.io>
          signoff: true
          title: "docs(cli): auto-update command reference for ${{ steps.target.outputs.dir }} (${{ inputs.version }})"
          body: |
            Auto-generated CLI command reference update.

            Generated from: `${{ github.sha }}`
            Trigger: promote of `${{ inputs.version }}` to the stable channel
          branch: auto/update-cli-docs-${{ inputs.version }}
          delete-branch: false
