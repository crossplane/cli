# The backing XR of claim.yaml. The harness pins it to the Composition's current revision.
apiVersion: pinned.diff.example.org/v1alpha1
kind: XPinned
metadata:
  name: manual-claim-x1y2z
spec:
  coolField: existing-value
  compositionUpdatePolicy: Manual
  compositionRef:
    name: xpinneds.pinned.diff.example.org
  claimRef:
    apiVersion: pinned.diff.example.org/v1alpha1
    kind: Pinned
    name: manual-claim
    namespace: default
